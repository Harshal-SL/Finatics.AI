version: "3.9"

# ─── Finatics.AI ──────────────────────────────────────────────────────────────
# docker compose up --build
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Express API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finatics-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Override FRONTEND_URL so CORS allows the vite preview container
      FRONTEND_URL: http://localhost:4173
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── React SPA (vite preview) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Root .env is auto-loaded by Compose, expanding these ${VAR} references
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: http://localhost:3000/api
        VITE_FRONTEND_URL: http://localhost:4173
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
        VITE_ALCHEMY_API_KEY: ${VITE_ALCHEMY_API_KEY:-}
        VITE_ALCHEMY_RPC_URL: ${VITE_ALCHEMY_RPC_URL:-}
    env_file:
      - ./frontend/.env
    container_name: finatics-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
